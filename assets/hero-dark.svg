<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-label="Shoval — Fintech | Project Manager · Building with AI and for AI">
  <style>
    .ui   { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, 'Noto Sans Hebrew', sans-serif; }
    .mono { font-family: 'Cascadia Mono', Consolas, 'SFMono-Regular', 'Courier New', monospace; }
    .cell { transform-box: fill-box; transform-origin: center;
      animation: cell-in .55s cubic-bezier(.2,.7,.3,1) both, cell-glow 4.4s 1.4s infinite ease-in-out; }
    .c1 { animation-delay: .10s, 1.4s; } .c2 { animation-delay: .22s, 1.9s; } .c3 { animation-delay: .30s, 2.4s; }
    .c4 { animation-delay: .40s, 2.9s; } .c5 { animation-delay: .50s, 3.4s; }
    @keyframes cell-in  { from { opacity: 0; transform: translateY(8px) scale(.55); } to { opacity: 1; transform: none; } }
    @keyframes cell-glow { 0%, 100% { opacity: 1; } 50% { opacity: .72; } }
    .fadein { animation: fade-in .7s .35s cubic-bezier(.2,.7,.3,1) both; }
    .fadein2 { animation: fade-in .7s .55s cubic-bezier(.2,.7,.3,1) both; }
    .fadein3 { animation: fade-in .7s .75s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    .px { animation: kpi-px-step 1.1s infinite cubic-bezier(.4,0,.2,1); }
    .p1 { animation-delay: 0s; } .p2 { animation-delay: .15s; } .p3 { animation-delay: .3s; } .p4 { animation-delay: .45s; }
    @keyframes kpi-px-step { 0%, 100% { transform: translateY(0); opacity: .5; } 35% { transform: translateY(-7px); opacity: 1; } }
    .tw { animation: twinkle 3.6s infinite ease-in-out; }
    .t1 { animation-delay: 0s; } .t2 { animation-delay: .6s; } .t3 { animation-delay: 1.1s; }
    .t4 { animation-delay: 1.7s; } .t5 { animation-delay: 2.2s; } .t6 { animation-delay: 2.8s; }
    @keyframes twinkle { 0%, 100% { opacity: .18; } 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .cell, .fadein, .fadein2, .fadein3, .px, .tw { animation: none; } }
  </style>

  <!-- canvas -->
  <rect x="1" y="1" width="958" height="268" rx="8" fill="#0C1416" stroke="#28393D" stroke-width="2"/>

  <!-- decorative pixel scatter (left) -->
  <g>
    <rect class="tw t1" x="64"  y="70"  width="9" height="9" rx="1" fill="#12A294"/>
    <rect class="tw t3" x="96"  y="102" width="7" height="7" rx="1" fill="#00A0B0"/>
    <rect class="tw t5" x="52"  y="140" width="8" height="8" rx="1" fill="#70B8B0"/>
    <rect class="tw t2" x="108" y="168" width="9" height="9" rx="1" fill="#2FB7AA"/>
    <rect class="tw t4" x="70"  y="198" width="7" height="7" rx="1" fill="#12A294"/>
    <rect class="tw t6" x="118" y="60"  width="6" height="6" rx="1" fill="#70B8B0"/>
  </g>

  <!-- workflow column (right), in place of kpiOS's quarter-hours -->
  <g class="mono" font-size="12" fill="#8AA0A4" opacity=".6" text-anchor="end">
    <text x="908" y="78">01 spec</text>
    <text x="908" y="118">02 build</text>
    <text x="908" y="158">03 review</text>
    <text x="908" y="198">04 ship</text>
  </g>

  <!-- lockup: PixelMark + wordmark -->
  <g>
    <rect class="cell c1" x="380" y="68"  width="16" height="16" rx="1.5" fill="#00A0B0"/>
    <rect class="cell c2" x="360" y="88"  width="16" height="16" rx="1.5" fill="#12A294"/>
    <rect class="cell c3" x="380" y="88"  width="16" height="16" rx="1.5" fill="#70B8B0"/>
    <rect class="cell c4" x="340" y="108" width="16" height="16" rx="1.5" fill="#006888"/>
    <rect class="cell c5" x="360" y="108" width="16" height="16" rx="1.5" fill="#70B8B0"/>
  </g>
  <text class="ui fadein" x="412" y="124" font-size="54" font-weight="700" letter-spacing="-1.5" fill="#D5E1E2">Shoval</text>

  <!-- overline -->
  <text class="ui fadein2" x="480" y="154" font-size="12" font-weight="600" letter-spacing="5" fill="#8AA0A4" text-anchor="middle">FINTECH · PROJECT MANAGER · KPI-FIN</text>

  <!-- tagline -->
  <text class="ui fadein3" x="480" y="188" font-size="17" fill="#8AA0A4" text-anchor="middle">Building with AI and for AI</text>

  <!-- pixel loader -->
  <g>
    <rect class="px p1" x="451" y="212" width="10" height="10" rx="1" fill="#12A294"/>
    <rect class="px p2" x="467" y="212" width="10" height="10" rx="1" fill="#00A0B0"/>
    <rect class="px p3" x="483" y="212" width="10" height="10" rx="1" fill="#006888"/>
    <rect class="px p4" x="499" y="212" width="10" height="10" rx="1" fill="#70B8B0"/>
  </g>
</svg>
